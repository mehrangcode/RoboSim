packages:
  - apps/*
  - packages/*
  - packages/boards/*
  - packages/components/*
  - packages/safety-rules/*

# Dependencies allowed to run install scripts (everything else is blocked by pnpm).
allowBuilds:
  '@swc/core': true
  esbuild: true
  protobufjs: false
  # Native Node bindings are not used: code-analysis loads the prebuilt tree-sitter-cpp.wasm.
  tree-sitter-c: false
  tree-sitter-cpp: false

patchedDependencies:
  planck@1.5.0: patches/planck@1.5.0.patch
