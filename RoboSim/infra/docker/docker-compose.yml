# Local infrastructure (Engineering Guide §2). Matches .env.example defaults.
# Status: written in P0 without a Docker host available — verify with `pnpm dev:infra` once Docker is installed.
name: robosim

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robosim
      POSTGRES_PASSWORD: robosim
      POSTGRES_DB: robosim
    ports: ['5432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U robosim -d robosim']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['valkey:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: robosim
      MINIO_ROOT_PASSWORD: robosim-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 robosim robosim-dev-secret &&
      mc mb --ignore-existing local/robosim-dev"
    restart: 'no'

  openbao:
    image: openbao/openbao:latest
    command: ['server', '-dev', '-dev-root-token-id=dev-root-token', '-dev-listen-address=0.0.0.0:8200']
    cap_add: ['IPC_LOCK']
    ports: ['8200:8200']

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres:
  valkey:
  minio:
