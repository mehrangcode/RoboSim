# CI gates for every pull request and push to main (Engineering Guide §7).
# Third-party actions are pinned to commit SHAs (Security §3, supply chain); Renovate bumps them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: AVR toolchain + pinned Arduino core/libraries (build service, ADR-022)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-avr avr-libc binutils-avr
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; the build sandbox needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pnpm compiler:setup
      - name: Format
        run: pnpm format:check
      - name: Build shared packages
        run: pnpm turbo run build --filter "./packages/*"
      - name: i18n parity, ICU, missing/unused keys (FR-I18N-03)
        run: pnpm i18n:check
      - name: Architecture boundaries (Technical Design §3.1)
        run: pnpm arch:check
      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build
      - name: Bundle budget (NFR-PERF-04)
        run: pnpm bundle:check

  security:
    name: Vulnerabilities · secrets · licences · SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --prod
      - name: Trivy filesystem scan (vulnerabilities, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: Docs
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
